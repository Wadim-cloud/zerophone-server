# Coturn Configuration
# Coturn handles TLS directly - no nginx proxy needed

# Listening ports
listening-port=3478
tls-listening-port=5349

# Your server IP
external-ip=136.144.172.78

# Domain
server-name=turn.wadiem.cloudns.be
realm=turn.wadiem.cloudns.be

# TLS certificates
cert=/etc/letsencrypt/live/turn.wadiem.cloudns.be/fullchain.pem
pkey=/etc/letsencrypt/live/turn.wadiem.cloudns.be/privkey.pem

# Authentication
lt-cred-mech
user=zerophone:zerophone123
total-quota=100
stale-nonce

# Logging
syslog

# No loopback
no-loopback-peers
no-multicast-peers