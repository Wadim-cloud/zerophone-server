# ZeroPhone Nginx Configuration
# For certificate via certbot: sudo certbot --nginx -d voip.wadiem.dnscloud.be

server {
    listen 80;
    listen [::]:80;
    server_name voip.wadiem.dnscloud.be;

    root /var/www/zerophone;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy for /ws endpoint
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/zerophone;
    }
}

# HTTPS server (after certbot runs)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voip.wadiem.dnscloud.be;

    ssl_certificate /etc/letsencrypt/live/voip.wadiem.dnscloud.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voip.wadiem.dnscloud.be/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zerophone;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}