# ZeroPhone Nginx Configuration
# For certificate via certbot: sudo certbot --nginx -d voip.wadiem.cloudns.be

server {
    listen 80;
    listen [::]:80;
    server_name voip.wadiem.cloudns.be;

    root /var/www/zerophone;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy for /ws endpoint
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS for WebSocket
        proxy_set_header Access-Control-Allow-Origin '*';
    }

    # API proxy - all Zerophone routes
    location ~ ^/(call|register|heartbeat|nodes|signal|status|ping|presence|dial|answer|call/request|call/end|call/signal|call/respond|sdp/offer|sdp/answer|sdp/receive|ice/candidate|ice/receive|ice/servers|stats|debug|secure) {
        # Allow all methods including OPTIONS for CORS preflight
        limit_except GET POST PUT DELETE OPTIONS PATCH HEAD {
            deny all;
        }
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        
        # Handle OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/zerophone;
    }
}

# HTTPS server (after certbot runs)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voip.wadiem.cloudns.be;

    ssl_certificate /etc/letsencrypt/live/voip.wadiem.cloudns.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voip.wadiem.cloudns.be/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

