services:
  zerophone:
    build: .
    network_mode: host
    ports:
      - "8443:8443"
    volumes:
      - zerophone-data:/data
      - ./static:/app/static:ro
      - ./cert.pem:/app/cert.pem:ro
      - ./key.pem:/app/key.pem:ro
    command: ["./zerophone", "--addr", ":8443", "--cert", "cert.pem", "--key", "key.pem"]
    environment:
      - ZEROPHONE_CLUSTER=1

  zerophone-node:
    build: .
    network_mode: host
    ports:
      - "8444:8443"
    volumes:
      - zerophone-node-data:/data
      - ./cert.pem:/app/cert.pem:ro
      - ./key.pem:/app/key.pem:ro
    command: ["./zerophone", "--addr", ":8443", "--cert", "cert.pem", "--key", "key.pem"]
    environment:
      - ZEROPHONE_CLUSTER=1
    depends_on:
      - zerophone

volumes:
  zerophone-data:
  zerophone-node-data: