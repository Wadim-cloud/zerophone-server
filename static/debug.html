<!DOCTYPE html>
<html>
<head>
	<title>ZeroPhone — Debug Dashboard</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		:root {
			--bg: #0d1117;
			--card: #161b22;
			--border: #30363d;
			--text: #c9d1d9;
			--muted: #8b949e;
			--accent: #58a6ff;
			--success: #3fb950;
			--danger: #f85149;
		}

		body {
			font-family: system-ui, -apple-system, sans-serif;
			background: var(--bg);
			color: var(--text);
			margin: 0;
			padding: 20px;
		}

		.container { max-width: 1200px; margin: auto; }

		header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		h1 { color: var(--accent); font-size: 20px; }

		button {
			background: var(--accent);
			color: white;
			border: none;
			padding: 8px 14px;
			border-radius: 8px;
			cursor: pointer;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
			gap: 16px;
		}

		.card {
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 14px;
		}

		h2 {
			font-size: 14px;
			color: var(--muted);
			margin-bottom: 10px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 13px;
		}

		th, td {
			text-align: left;
			padding: 6px;
			border-bottom: 1px solid var(--border);
		}

		th { color: var(--muted); font-weight: 500; }

		.status {
			padding: 3px 6px;
			border-radius: 5px;
			font-size: 11px;
		}

		.status.online {
			background: rgba(63,185,80,0.2);
			color: var(--success);
		}

		.status.offline {
			background: rgba(248,81,73,0.2);
			color: var(--danger);
		}

		.mono { font-family: monospace; font-size: 12px; }

		pre {
			background: #0b0f14;
			padding: 10px;
			border-radius: 8px;
			overflow: auto;
			font-size: 11px;
			max-height: 240px;
		}

		.footer {
			color: var(--muted);
			font-size: 11px;
			margin-top: 10px;
		}
	</style>
</head>

<body>
<div class="container">

	<header>
		<h1>🔧 ZeroPhone Cluster Dashboard</h1>
		<button onclick="refreshAll()">Refresh</button>
	</header>

	<div class="grid">

		<div class="card">
			<h2>System Status</h2>
			<table id="status"></table>
			<div class="footer" id="statusTime"></div>
		</div>

		<div class="card">
			<h2>Cluster Nodes</h2>
			<table id="nodes"></table>
			<div class="footer" id="nodesTime"></div>
		</div>

		<div class="card">
			<h2>Cluster API</h2>
			<table id="cluster"></table>
		</div>

		<div class="card" style="grid-column: 1/-1;">
			<h2>Raw Debug Output</h2>

			<h3>/status</h3>
			<pre id="rawStatus"></pre>

			<h3>/nodes</h3>
			<pre id="rawNodes"></pre>

			<h3>/cluster/nodes</h3>
			<pre id="rawCluster"></pre>
		</div>

	</div>
</div>

<script>
const API = window.location.origin;

async function refreshAll() {
	await Promise.all([
		loadStatus(),
		loadNodes(),
		loadCluster()
	]);
}

async function loadStatus() {
	const r = await fetch(`${API}/status`);
	const d = await r.json();

	document.getElementById("rawStatus").textContent = JSON.stringify(d, null, 2);

	const t = document.getElementById("status");
	t.innerHTML = "";

	Object.entries(d).forEach(([k, v]) => {
		t.innerHTML += `<tr><td>${k}</td><td class="mono">${v}</td></tr>`;
	});

	document.getElementById("statusTime").textContent =
		"Updated: " + new Date().toLocaleTimeString();
}

async function loadNodes() {
	const r = await fetch(`${API}/nodes`);
	const d = await r.json();

	document.getElementById("rawNodes").textContent = JSON.stringify(d, null, 2);

	const t = document.getElementById("nodes");
	t.innerHTML = "<tr><th>Name</th><th>ID</th><th>IP</th><th>Status</th></tr>";

	d.forEach(n => {
		t.innerHTML += `
			<tr>
				<td>${n.name || "-"}</td>
				<td class="mono">${n.id}</td>
				<td class="mono">${n.zerotier_ip || n.ip || "-"}</td>
				<td><span class="status ${n.status}">${n.status || "unknown"}</span></td>
			</tr>
		`;
	});

	document.getElementById("nodesTime").textContent =
		`Updated: ${new Date().toLocaleTimeString()} (${d.length})`;
}

async function loadCluster() {
	const r = await fetch(`${API}/cluster/nodes`);
	const d = await r.json();

	document.getElementById("rawCluster").textContent = JSON.stringify(d, null, 2);

	const t = document.getElementById("cluster");
	t.innerHTML = "";

	Object.entries(d || {}).forEach(([k, v]) => {
		t.innerHTML += `<tr><td>${k}</td><td class="mono">${JSON.stringify(v)}</td></tr>`;
	});
}

refreshAll();
setInterval(refreshAll, 5000);
</script>

</body>
</html>
