<!DOCTYPE html>
<html>
<head>
    <title>ZeroPhone — Voice Call</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg:#0d1117; --card:#161b22; --border:#30363d;
            --text:#c9d1d9; --accent:#58a6ff;
            --success:#3fb950; --danger:#f85149;
            --warning:#f0883e; --muted:#6e7681;
        }

        * { box-sizing:border-box; margin:0; padding:0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container { max-width: 520px; margin:0 auto; text-align:center; }

        h1 { color:var(--accent); margin-bottom:8px; }

        .status-bar {
            padding:16px;
            border-radius:14px;
            margin:14px 0;
            border:2px solid var(--border);
        }

        .card {
            background: var(--card);
            border:1px solid var(--border);
            border-radius:14px;
            padding:16px;
            margin:12px 0;
        }

        .btn {
            padding:10px 16px;
            border-radius:10px;
            border:none;
            cursor:pointer;
            background:var(--accent);
            color:white;
        }

        .btn-danger { background:var(--danger); }
        .btn-success { background:var(--success); }

        /* VU meter */
        .vu {
            display:flex;
            justify-content:center;
            gap:4px;
            margin:12px 0;
            height:40px;
            align-items:flex-end;
        }

        .bar {
            width:4px;
            background:var(--success);
            height:6px;
            transition:height 0.08s ease;
        }

        /* Push to talk */
        .ptt {
            margin-top:10px;
            background: var(--warning);
        }

        .ptt.active {
            background: var(--success);
        }

        /* stats */
        .stats {
            font-size:12px;
            text-align:left;
            opacity:0.85;
            margin-top:10px;
        }

        .hidden { display:none; }
    </style>
</head>

<body>
<div class="container">
    <h1>📞 ZeroPhone</h1>

    <div id="status" class="status-bar">Idle</div>

    <div class="card">
        <div class="vu" id="vu"></div>

        <button class="btn ptt" id="pttBtn">🎙 Hold to Talk</button>

        <button class="btn btn-danger" onclick="endCall()">End Call</button>

        <div class="stats" id="stats">
            jitter: -- ms<br>
            packet loss: --%<br>
            rtt: -- ms
        </div>
    </div>
</div>

<script>
let pc;
let ws;
let localStream;
let audioCtx;
let analyser;
let dataArray;
let micEnabled = false;
let ptt = false;
let statsInterval;

/* ---------------------------
   AUDIO: VU METER SETUP
----------------------------*/
function setupVU(stream) {
    audioCtx = new AudioContext();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();

    analyser.fftSize = 64;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    source.connect(analyser);

    const vu = document.getElementById('vu');
    vu.innerHTML = '';

    for (let i = 0; i < 12; i++) {
        const b = document.createElement('div');
        b.className = 'bar';
        vu.appendChild(b);
    }

    function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        document.querySelectorAll('.bar').forEach((bar, i) => {
            const v = dataArray[i] || 0;
            bar.style.height = (v / 4) + 'px';
        });
    }

    draw();
}

/* ---------------------------
   OPUS FORCE (BEST EFFORT)
----------------------------*/
function forceOpus(pc) {
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
    if (!sender) return;

    const params = sender.getParameters();
    const caps = RTCRtpSender.getCapabilities('audio');

    if (caps && caps.codecs) {
        const opus = caps.codecs.filter(c => c.mimeType.toLowerCase().includes('opus'));
        if (opus.length) {
            params.codecs = opus;
            sender.setParameters(params);
        }
    }
}

/* ---------------------------
   PACKET LOSS SIMULATION
----------------------------*/
function simulateLoss(stream) {
    const track = stream.getAudioTracks()[0];

    setInterval(() => {
        if (!pc || pc.connectionState !== 'connected') return;

        // 10% random drop simulation
        if (Math.random() < 0.1) {
            track.enabled = false;
            setTimeout(() => track.enabled = true, 80);
        }
    }, 120);
}

/* ---------------------------
   STATS (JITTER / LOSS)
----------------------------*/
async function startStats() {
    statsInterval = setInterval(async () => {
        if (!pc) return;

        const stats = await pc.getStats();
        let jitter = 0;
        let packetsLost = 0;
        let packetsRecv = 0;
        let rtt = 0;

        stats.forEach(report => {
            if (report.type === 'inbound-rtp') {
                jitter = report.jitter || 0;
                packetsLost = report.packetsLost || 0;
                packetsRecv = report.packetsReceived || 0;
            }
            if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                rtt = report.currentRoundTripTime || 0;
            }
        });

        const loss = packetsLost + packetsRecv
            ? (packetsLost / (packetsLost + packetsRecv) * 100).toFixed(1)
            : 0;

        document.getElementById('stats').innerHTML =
            `jitter: ${(jitter*1000).toFixed(1)} ms<br>
             packet loss: ${loss}%<br>
             rtt: ${(rtt*1000).toFixed(0)} ms`;
    }, 1000);
}

/* ---------------------------
   PUSH TO TALK (HALF DUPLEX)
----------------------------*/
function setupPTT() {
    const btn = document.getElementById('pttBtn');

    function enable() {
        ptt = true;
        btn.classList.add('active');
        if (localStream)
            localStream.getAudioTracks().forEach(t => t.enabled = true);
    }

    function disable() {
        ptt = false;
        btn.classList.remove('active');
        if (localStream)
            localStream.getAudioTracks().forEach(t => t.enabled = false);
    }

    btn.addEventListener('mousedown', enable);
    btn.addEventListener('mouseup', disable);
    btn.addEventListener('touchstart', enable);
    btn.addEventListener('touchend', disable);

    // keyboard push-to-talk
    window.addEventListener('keydown', e => {
        if (e.code === 'Space') enable();
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'Space') disable();
    });
}

/* ---------------------------
   WEBRTC INIT (SIMPLIFIED)
----------------------------*/
async function startCall() {
    localStream = await navigator.mediaDevices.getUserMedia({ audio:true });

    setupVU(localStream);
    simulateLoss(localStream);
    setupPTT();

    pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.ontrack = e => {
        const audio = document.createElement('audio');
        audio.srcObject = e.streams[0];
        audio.autoplay = true;
        document.body.appendChild(audio);
    };

    pc.onconnectionstatechange = () => {
        document.getElementById('status').innerText = pc.connectionState;
    };

    forceOpus(pc);
    startStats();
}

/* ---------------------------
   END CALL
----------------------------*/
function endCall() {
    if (pc) pc.close();
    if (statsInterval) clearInterval(statsInterval);
    document.getElementById('status').innerText = "Ended";
}

startCall();
</script>
</body>
</html>
