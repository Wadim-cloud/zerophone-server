<!DOCTYPE html>
<html>
<head>
    <title>ZeroPhone — Call</title>
    <meta charset="UTF-8">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --success: #3fb950; --danger: #f85149; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 400px; margin: 0 auto; text-align: center; }
        h1 { color: var(--accent); margin-bottom: 20px; }
        .btn { background: var(--accent); color: white; border: none; padding: 16px 32px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; width: 100%; margin: 8px 0; }
        .btn.call { background: var(--success); }
        .btn.end { background: var(--danger); }
        .status { padding: 12px; margin: 12px 0; border-radius: 8px; background: var(--card); }
        .status.idle { border: 1px solid var(--border); }
        .status.connecting { border: 1px solid var(--warning); color: #f0883e; }
        .status.active { border: 1px solid var(--success); color: var(--success); }
        #peers { margin: 20px 0; }
        .peer { padding: 12px; margin: 8px 0; border-radius: 8px; background: var(--card); display: flex; justify-content: space-between; align-items: center; }
        .peer-name { font-weight: 600; }
        .log { font-size: 0.75rem; color: #8b949e; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📞 ZeroPhone Call</h1>

        <div id="status" class="status idle">Not connected</div>

        <div id="peers"></div>

        <div class="log" id="log"></div>
    </div>

    <script>
        const SERVER = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host;
        let ws = null;
        let myId = localStorage.getItem('zerophone_id') || 'user-' + Math.random().toString(36).substr(2,8);
        let state = 'idle';
        let pc = null;
        let localStream = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { 
                    urls: 'turn:turn.wadiem.cloudns.be:3478',
                    username: 'zerophone',
                    credential: 'secretpassword'
                }
            ]
        };

        // Call state machine
        const CallState = { IDLE: 'idle', INVITING: 'inviting', RINGING: 'ringing', CONNECTING: 'connecting', ACTIVE: 'active' };

        function log(msg) {
            document.getElementById('log').innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + msg + '<br>' + document.getElementById('log').innerHTML;
        }

        function connect() {
            ws = new WebSocket(SERVER + '/ws/' + myId);

            ws.onopen = () => {
                log('Connected as ' + myId);
                updateStatus(CallState.IDLE);
                loadPeers();
                getUserMedia();
            };

            ws.onmessage = async (e) => {
                const msg = JSON.parse(e.data);
                handleMessage(msg);
            };

            ws.onclose = () => {
                log('Disconnected');
                updateStatus(CallState.IDLE);
                setTimeout(connect, 3000);
            };

            ws.onerror = (e) => log('Error: ' + e);
        }

        function handleMessage(msg) {
            switch(msg.type) {
                case 'CALL_INVITE':
                    if (state === CallState.IDLE) {
                        state = CallState.RINGING;
                        updateStatus(CallState.RINGING);
                        log('Incoming call from ' + msg.from);
                        // Auto-answer for demo, or prompt user
                        acceptCall(msg);
                    }
                    break;
                case 'CALL_ACCEPT':
                    if (state === CallState.INVITING) {
                        state = CallState.CONNECTING;
                        updateStatus(CallState.CONNECTING);
                        pc.setRemoteDescription(new RTCSessionDescription(msg.payload.sdp));
                        log('Call accepted');
                        state = CallState.ACTIVE;
                        updateStatus(CallState.ACTIVE);
                    }
                    break;
                case 'CALL_RINGING':
                    log('Ringing...');
                    break;
                case 'ICE_CANDIDATE':
                    if (pc) pc.addIceCandidate(new RTCIceCandidate(msg.payload));
                    break;
                case 'CALL_END':
                    endCall();
                    break;
                case 'USERS':
                    renderPeers(msg.users);
                    break;
            }
        }

        // WebRTC call flow
        async function makeCall(toId) {
            state = CallState.INVITING;
            updateStatus(CallState.INVITING);

            pc = new RTCPeerConnection(rtcConfig);
            pc.onicecandidate = (e) => {
                if (e.candidate) ws.send(JSON.stringify({ type: 'ICE_CANDIDATE', to: toId, payload: e.candidate }));
            };
            pc.ontrack = (e) => {
                document.body.appendChild(document.createElement('audio')).srcObject = e.streams[0];
            };

            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            ws.send(JSON.stringify({
                type: 'CALL_INVITE',
                to: toId,
                payload: { sdp: pc.localDescription }
            }));

            log('Calling ' + toId);
        }

        async function acceptCall(inviteMsg) {
            pc = new RTCPeerConnection(rtcConfig);
            pc.onicecandidate = (e) => {
                if (e.candidate) ws.send(JSON.stringify({ type: 'ICE_CANDIDATE', to: inviteMsg.from, payload: e.candidate }));
            };
            pc.ontrack = (e) => {
                document.body.appendChild(document.createElement('audio')).srcObject = e.streams[0];
            };

            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            await pc.setRemoteDescription(new RTCSessionDescription(inviteMsg.payload.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            ws.send(JSON.stringify({
                type: 'CALL_ACCEPT',
                to: inviteMsg.from,
                payload: { sdp: pc.localDescription }
            }));

            state = CallState.ACTIVE;
            updateStatus(CallState.ACTIVE);
            log('Call connected');
        }

        function endCall() {
            if (pc) pc.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            state = CallState.IDLE;
            updateStatus(CallState.IDLE);
            log('Call ended');
        }

        async function getUserMedia() {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        }

        function loadPeers() {
            ws.send(JSON.stringify({ type: 'GET_USERS' }));
        }

        function renderPeers(users) {
            const div = document.getElementById('peers');
            div.innerHTML = users.map(u =>
                `<div class="peer">
                    <span class="peer-name">${u.name}</span>
                    <button class="btn" onclick="makeCall('${u.id}')">Call</button>
                </div>`
            ).join('');
        }

        function updateStatus(s) {
            state = s;
            const el = document.getElementById('status');
            el.className = 'status ' + s;
            el.textContent = { idle: 'Ready', inviting: 'Calling...', ringing: 'Incoming...', connecting: 'Connecting...', active: 'In Call' }[s];
        }

        connect();
    </script>
</body>
</html>
