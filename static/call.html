<!DOCTYPE html>
<html>
<head>
    <title>ZeroPhone — Control Terminal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #0a0e14;
            color: #79c0ff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            height: 100vh;
        }

        /* Sidebar - User List */
        .sidebar {
            background: #0d1117;
            border-right: 1px solid #21262d;
            padding: 16px;
            overflow-y: auto;
        }

        .sidebar h3 {
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            letter-spacing: 1px;
        }

        .user-item {
            padding: 10px 12px;
            margin: 4px 0;
            background: #161b22;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .user-item:hover {
            background: #1f242c;
        }

        .user-item .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .user-item .status-dot.online { background: #3fb950; }
        .user-item .status-dot.busy { background: #f0883e; }
        .user-item .status-dot.offline { background: #6e7681; }

        .user-item .node-badge {
            float: right;
            font-size: 10px;
            color: #8b949e;
            background: #21262d;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Main - Call Panel */
        .main {
            background: #0d1117;
            border-right: 1px solid #21262d;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .call-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #21262d;
        }

        .call-header h2 {
            margin: 0;
            color: #58a6ff;
        }

        .call-status {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            background: #161b22;
        }

        .call-status.idle { color: #8b949e; }
        .call-status.invite { color: #f0883e; }
        .call-status.ringing { color: #d29922; }
        .call-status.active { color: #3fb950; background: #0d2a1a; }
        .call-status.ended { color: #f85149; }

        .mic-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #79c0ff;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 1000;
            display: none;
        }

        .mic-level {
            width: 100px;
            height: 4px;
            background: #30363d;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 5px;
        }

        .mic-level-fill {
            height: 100%;
            background: #3fb950;
            width: 0%;
            transition: width 0.1s;
        }

        .fsm-visual {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .fsm-state {
            padding: 8px 16px;
            background: #161b22;
            border-radius: 6px;
            font-size: 12px;
            color: #8b949e;
            opacity: 0.5;
        }

        .fsm-state.active {
            opacity: 1;
            background: #1f3a5f;
            color: #58a6ff;
        }

        .fsm-state.done {
            opacity: 1;
            color: #3fb950;
            background: #0d2a1a;
        }

        .ice-info {
            margin-top: 12px;
            padding: 12px;
            background: #161b22;
            border-radius: 6px;
            font-size: 11px;
        }

        .ice-info .label { color: #8b949e; }
        .ice-info .value { color: #7ee787; }

        .controls {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #21262d;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 4px;
            transition: all 0.15s;
        }

        .btn-invite { background: #238636; color: white; }
        .btn-invite:hover { background: #2ea043; }

        .btn-reject { background: #da3633; color: white; }

        .btn-bye { background: #f85149; color: white; }

        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Debug Panel */
        .debug {
            background: #0d1117;
            padding: 16px;
            overflow-y: auto;
        }

        .debug h3 {
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            margin: 0 0 12px 0;
        }

        .debug-entry {
            font-size: 11px;
            padding: 8px;
            margin: 4px 0;
            background: #161b22;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            word-break: break-all;
        }

        .debug-entry .ts { color: #6e7681; }
        .debug-entry .type { color: #d29922; }
        .debug-entry .from { color: #f778ba; }
        .debug-entry .to { color: #79c0ff; }
        .debug-entry .meta { color: #7ee787; font-size: 10px; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .modal h3 { margin: 0 0 16px 0; }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
            .sidebar, .debug { height: 200px; }
        }
    </style>
</head>
<body>

<div class="layout">
    <!-- Sidebar: User List -->
    <div class="sidebar">
        <h3>Network Nodes</h3>
        <div id="users"></div>
    </div>

    <!-- Main: Call Panel -->
    <div class="main">
        <div class="call-header">
            <h2>📡 ZeroPhone Control</h2>
            <span class="call-status idle" id="globalStatus">IDLE</span>
        </div>

        <div class="fsm-visual">
            <span class="fsm-state" data-state="IDLE">IDLE</span>
            <span class="fsm-state" data-state="INVITE">INVITE</span>
            <span class="fsm-state" data-state="RINGING">RINGING</span>
            <span class="fsm-state" data-state="ACTIVE">ACTIVE</span>
            <span class="fsm-state" data-state="ENDED">ENDED</span>
        </div>

        <div class="ice-info" id="iceInfo" style="display:none;">
            <div><span class="label">Network:</span> <span class="value" id="iceNetwork">-</span></div>
            <div><span class="label">Relay:</span> <span class="value" id="iceRelay">-</span></div>
            <div><span class="label">Boost:</span> <span class="value" id="iceBoost">-</span></div>
        </div>

        <div class="controls">
            <input id="sipExtension" placeholder="SIP Extension (e.g. 1001)" style="
                width: 100%;
                padding: 12px;
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 8px;
                color: #c9d1d9;
                margin-bottom: 8px;
            " />
            <select id="sipPickupPolicy" style="
                width: 100%;
                padding: 10px;
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 8px;
                color: #c9d1d9;
                margin-bottom: 8px;
            ">
                <option value="single">single (only first answer wins)</option>
                <option value="shared">shared (allow multiple users to join)</option>
            </select>
            <button class="btn" onclick="registerSIPExtension()" style="background: #1f6feb; color: white;">Register SIP Extension</button>
            <input id="targetUser" placeholder="Target User ID" style="
                width: 100%;
                padding: 12px;
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 8px;
                color: #c9d1d9;
                margin-bottom: 12px;
            " />

            <button class="btn btn-invite" onclick="sendINVITE()">📞 INVITE</button>
            <button class="btn btn-bye" onclick="sendBYE()" disabled>End Call</button>
            <button class="btn" onclick="testMicrophone()" style="background: #6e7681; color: white;">🎤 Test Mic</button>
        </div>
    </div>

    <!-- Debug Panel -->
    <div class="debug">
        <h3>Signal Log</h3>
        <div id="signalLog"></div>
    </div>
</div>

<!-- Remote Audio Element (REQUIRED) -->
<audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>

<!-- Incoming Call Modal -->
<div class="modal-overlay" id="incomingModal">
    <div class="modal">
        <h3>📲 Incoming Call</h3>
        <p id="callerInfo">Unknown caller</p>
        <input type="hidden" id="incomingCallId" value="">
        <div class="modal-buttons">
            <button class="btn btn-invite" onclick="acceptCall()">Accept</button>
            <button class="btn btn-reject" onclick="rejectCall()">Reject</button>
        </div>
    </div>
</div>

<!-- Microphone Level Indicator -->
<div class="mic-indicator" id="micIndicator">
    🎤 Microphone Level
    <div class="mic-level">
        <div class="mic-level-fill" id="micLevelFill"></div>
    </div>
</div>

<script>
// Mobile WebRTC strictly requires Secure Context (HTTPS)
if (!window.isSecureContext && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
    alert("CRITICAL WARNING: You are not using a secure connection (HTTPS). Mobile browsers will aggressively block microphone access. Please switch to https://dev.wadiem.cloudns.be");
    console.error("Insecure Context: getUserMedia will fail!");
}
// ZeroPhone Control Terminal JavaScript loaded

/* =====================================================
   STATE: Call FSM (mirrors backend core/call_state_machine.go)
   ===================================================== */
const CallState = {
    IDLE: 'IDLE',
    INVITE: 'INVITE', 
    RINGING: 'RINGING',
    ACTIVE: 'ACTIVE',
    ENDED: 'ENDED'
};

/* =====================================================
   TRANSPORT: WebSocket Singleton
   ===================================================== */
let ws = null;
let userId = 'user-' + Math.random().toString(36).substr(2, 8);

/* =====================================================
   STATE STORE: Multi-call support
   ===================================================== */
let appState = {
    calls: {}, // callId → CallState object
    users: [],
    activeCallId: null, // currently focused call
    localUserId: userId
};

// 🔊 Global WebRTC state
let pc = null;
let localStream = null;
let callID = null;
let currentPeer = null;
let pendingIceCandidates = []; // Buffer ICE candidates before PC is ready

// Audio elements for call feedback
let ringingAudio = null;
let audioUnlocked = false;

// 🔓 Unlock audio (required once per session)
function unlockAudio() {
    if (audioUnlocked) return;

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume().then(() => {
        console.log("🔊 Audio unlocked");
        audioUnlocked = true;
        
        // Mobile iOS Safari workaround: immediately pre-play the remoteAudio element
        const remoteAudio = document.getElementById("remoteAudio");
        if (remoteAudio) {
            remoteAudio.play().catch(e => console.warn("Pre-play blocked:", e));
        }
    }).catch(err => {
        console.error("Audio unlock failed:", err);
    });
}

// 🎧 Create PeerConnection (core WebRTC engine)
function createPeerConnection() {
    pc = new RTCPeerConnection({
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            {
                urls: [
                    "turn:87.106.91.46:3478?transport=udp",
                    "turn:87.106.91.46:3478?transport=tcp"
                ],
                username: "wadiem",
                credential: "Wadiem123!"
            }
        ]
    });

    console.log("WEBRTC: PeerConnection created");

    // 🔊 Handle remote audio tracks (supports Unified Plan without stream wrapper)
    pc.ontrack = (event) => {
        console.log("WEBRTC: Remote track received - kind:", event.track.kind, "streams:", event.streams ? event.streams.length : 0);

        const audio = document.getElementById("remoteAudio");
        if (audio) {
            let stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
            audio.srcObject = stream;
            audio.muted = false;
            audio.volume = 1.0;
            audio.playsInline = true;

            audio.play().then(() => {
                console.log("WEBRTC: Remote audio playing successfully");
                startAudioEnergyMonitoring(stream);
            }).catch(err => {
                console.warn("WEBRTC: Autoplay blocked, audio will play after user interaction:", err.message);
            });

            audio._stream = stream;
        }
    };

    // ❄️ Handle outgoing ICE candidates
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            const targetPeer = currentPeer || (appState.calls[callID] ? (appState.calls[callID].from === appState.localUserId ? appState.calls[callID].to : appState.calls[callID].from) : '');
            console.log("❄️ Sending ICE candidate to:", targetPeer);
            sendSignal({
                type: "ICE",
                call_id: callID,
                to: targetPeer,
                from: appState.localUserId,
                data: {
                    candidate: event.candidate.candidate,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex
                }
            });
        }
    };

    // 🔍 Connection state monitoring
    pc.onconnectionstatechange = () => {
        console.log("WEBRTC: Connection state:", pc.connectionState);
    };

    pc.oniceconnectionstatechange = () => {
        console.log("WEBRTC: ICE connection state:", pc.iceConnectionState);
    };

    pc.oniceconnectionstatechange = () => {
        console.log("WEBRTC: ICE connection state:", pc.iceConnectionState);
    };
}

// 🎤 Get microphone and attach to PeerConnection
async function initLocalMedia() {
    try {
        if (!localStream) {
            console.log("WEBRTC: Requesting microphone access");
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                },
                video: false
            });
        } else {
            console.log("WEBRTC: Reusing persistent microphone stream");
        }

        console.log("WEBRTC: Local stream obtained with", localStream.getTracks().length, "tracks");

        if (pc && localStream) {
            const tracks = localStream.getTracks();
            console.log("WEBRTC: Adding", tracks.length, "local tracks to PeerConnection");

            tracks.forEach(track => {
                console.log("WEBRTC: Adding local track:", track.kind, track.label, "enabled:", track.enabled);
                pc.addTrack(track, localStream);
            });

            // Verify tracks were added
            setTimeout(() => {
                const senders = pc.getSenders();
                console.log("WEBRTC: PeerConnection now has", senders.length, "senders");
                senders.forEach((sender, i) => {
                    if (sender.track) {
                        console.log("WEBRTC: Sender", i, "- track:", sender.track.kind, "enabled:", sender.track.enabled);
                    }
                });
            }, 100);
        } else {
            console.error("WEBRTC: No PeerConnection or localStream available");
        }

        return true;
    } catch(err) {
        console.error("WEBRTC: Failed to get microphone:", err.message);
        return false;
    }
}

function startMicMonitoring() {
    try {
        const indicator = document.getElementById('micIndicator');
        const levelFill = document.getElementById('micLevelFill');

        if (!indicator || !levelFill) return;

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const microphone = audioContext.createMediaStreamSource(stream);
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            analyser.fftSize = 256;
            microphone.connect(analyser);

            indicator.style.display = 'block';

            function updateMicLevel() {
                analyser.getByteFrequencyData(dataArray);
                const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                const level = Math.min(100, (average / 255) * 100);
                levelFill.style.width = level + '%';

                if (audioUnlocked) {
                    requestAnimationFrame(updateMicLevel);
                }
            }

            updateMicLevel();

            log('AUDIO', 'Microphone monitoring started');

        }).catch(err => {
            log('AUDIO', 'Could not start microphone monitoring:', err.message);
        });

    } catch(e) {
        log('AUDIO', 'Mic monitoring setup failed:', e);
    }
}

// CallState object structure
function createCallState(callId, from, to) {
    return {
        callId: callId,
        state: CallState.IDLE,
        from: from || null,
        to: to || null,
        sdp: null,
        iceCandidates: [],
        iceStrategy: null,
        peerConnection: null,
        localStream: null,
        history: [],
        created: Date.now()
    };
}

/* =====================================================
   LAYER 1: TRANSPORT
   ===================================================== */
function connectWS() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsPath = location.pathname.startsWith('/zerophone') ? `/zerophone/ws/${userId}` : `/ws/${userId}`;
    ws = new WebSocket(`${protocol}//${location.host}${wsPath}`);

    ws.onopen = () => {
        log('TRANSPORT', 'WebSocket connected as ' + userId);
        appState.localUserId = userId;
        const urlParams = new URLSearchParams(window.location.search);
        const autoExt = (urlParams.get('ext') || '').trim();
        if (autoExt) {
            const extInput = document.getElementById('sipExtension');
            if (extInput) extInput.value = autoExt;
            registerSIPExtension();
        }
    };

    ws.onmessage = async (evt) => {
        try {
            const signal = JSON.parse(evt.data);
            await handleSignal(signal);
        } catch(e) {
            log('TRANSPORT', 'Parse error:', e.message);
        }
    };

    ws.onclose = () => {
        log('TRANSPORT', 'WebSocket disconnected');
        setTimeout(connectWS, 3000);
    };

    ws.onerror = (e) => {
        log('TRANSPORT', 'WebSocket error');
    };
}

async function registerSIPExtension() {
    const extInput = document.getElementById('sipExtension');
    if (!extInput) return;
    const extension = extInput.value.trim();
    if (!extension) {
        log('SIP', 'Enter extension first');
        return;
    }
    if (!appState.localUserId) {
        log('SIP', 'No local user id yet');
        return;
    }
    const policyEl = document.getElementById('sipPickupPolicy');
    const policy = policyEl ? policyEl.value : 'single';
    try {
        const resp = await fetch('/sip/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                extension: extension,
                user_id: appState.localUserId,
                policy: policy
            })
        });
        if (!resp.ok) {
            const txt = await resp.text();
            log('SIP', 'Register failed:', txt);
            return;
        }
        log('SIP', `Registered ext ${extension} -> ${appState.localUserId} (${policy})`);
    } catch (e) {
        log('SIP', 'Register error:', e.message);
    }
}

// 📡 Send signal helper
function sendSignal(signal) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        console.error('TRANSPORT: WebSocket not connected');
        return;
    }
    console.log('📡 Sending signal:', signal.type, 'to:', signal.to);
    ws.send(JSON.stringify(signal));
}

/* =====================================================
   LAYER 2: SIGNAL ROUTER (frontend mirror of backend)
   ===================================================== */
async function handleSignal(signal) {
    const callId = signal.call_id || signal.callId;
    
    log('SIGNAL', signal.type, signal.from || '?', signal.to || '?', callId || '');
    
    // Route to appropriate handler
    switch(signal.type) {
        case 'USERS':
            updateUserPresence(signal.users || []);
            break;
        default:
            // All call-related signals
            handleCallSignal(signal);
            break;
    }
}

/* =====================================================
   LAYER 3: CALL STATE STORE (mirrors backend FSM)
   ===================================================== */
function getCallState(callId) {
    return appState.calls[callId];
}

function setCallState(callId, state, peerId = null, isOutgoing = false) {
    let call = appState.calls[callId];
    if (!call) {
        if (isOutgoing) {
            // Outgoing call: from = local user, to = peer
            call = createCallState(callId, appState.localUserId, peerId);
        } else {
            // Incoming call: from = peer, to = local user
            call = createCallState(callId, peerId, appState.localUserId);
        }
        appState.calls[callId] = call;
    }

    // Record history
    call.history.push({
        state: call.state,
        timestamp: Date.now(),
        signal: state
    });

    // Update state
    call.state = state;

    // Auto-focus new calls
    if (state === CallState.INVITE && !appState.activeCallId) {
        appState.activeCallId = callId;
    }

    updateCallDisplay();
    updateGlobalStatus();
}

function removeCall(callId) {
    delete appState.calls[callId];
    if (appState.activeCallId === callId) {
        appState.activeCallId = null;
        // Auto-focus next active call
        const activeCalls = Object.values(appState.calls).filter(c => 
            c.state !== CallState.IDLE && c.state !== CallState.ENDED
        );
        if (activeCalls.length > 0) {
            appState.activeCallId = activeCalls[0].callId;
        }
    }
    updateCallDisplay();
}

/* =====================================================
   LAYER 5: UI CONTROLLERS
   ===================================================== */
function updateCallDisplay() {
    // Update active call focus
    const activeCall = appState.calls[appState.activeCallId];
    const globalStatus = document.getElementById('globalStatus');
    const endCallBtn = document.querySelector('.btn-bye');

    if (activeCall) {
        globalStatus.textContent = `${activeCall.state} (${activeCall.callId.slice(0,8)})`;
        globalStatus.className = 'call-status ' + activeCall.state.toLowerCase();

        // Enable end call button for active calls
        if (endCallBtn) {
            endCallBtn.disabled = false;
            endCallBtn.textContent = 'End Call';
        }

        // Update FSM visualization
        updateFSMVisualization(activeCall);

        // Update ICE info
        updateICEDisplay(activeCall.iceStrategy);

    } else {
        globalStatus.textContent = 'IDLE';
        globalStatus.className = 'call-status idle';

        // Disable end call button when no active call
        if (endCallBtn) {
            endCallBtn.disabled = true;
            endCallBtn.textContent = 'End Call';
        }
    }

    // Update call list in debug panel
    updateCallList();
}

function updateFSMVisualization(call) {
    document.querySelectorAll('.fsm-state').forEach(el => {
        const state = el.dataset.state;
        el.classList.remove('active', 'done');
        
        if (state === call.state) {
            el.classList.add('active');
        } else {
            // Mark previous states as done
            const states = ['IDLE', 'INVITE', 'RINGING', 'ACTIVE', 'ENDED'];
            const currentIdx = states.indexOf(call.state);
            const stateIdx = states.indexOf(state);
            if (stateIdx < currentIdx) {
                el.classList.add('done');
            }
        }
    });
}

function updateICEDisplay(iceStrategy) {
    const container = document.getElementById('iceInfo');
    if (!iceStrategy) {
        container.style.display = 'none';
        return;
    }
    
    container.style.display = 'block';
    document.getElementById('iceNetwork').textContent = iceStrategy.preferred_network || 'unknown';
    document.getElementById('iceRelay').textContent = iceStrategy.use_relay ? iceStrategy.relay_node : 'none';
    document.getElementById('iceBoost').textContent = iceStrategy.priority_boost || 0;
}

function updateUserPresence(users) {

            <span class="status-dot ${statusClass}"></span>

}

/* =====================================================
   CALL SIGNAL HANDLERS
   ===================================================== */
// 📥 Handle incoming signals (WebRTC-aware)
function handleCallSignal(signal) {
    console.log("📡 Processing signal:", signal.type, "call:", signal.call_id, "raw signal:", signal);

    // SDP and candidate are now direct fields in the signal

    switch(signal.type) {
        case 'INVITE':
            onINVITE(signal);
            break;
        case 'TRYING':
            setCallState(signal.call_id, CallState.INVITE);
            break;
        case 'RINGING':
            setCallState(signal.call_id, CallState.RINGING);
            break;
        case 'OK':
            onOK(signal);
            break;
        case 'REJECT':
            onREJECT(signal);
            break;
        case 'BYE':
            onBYE(signal);
            break;
        case 'SDP':
            // SDP is now handled inline with OK signal
            break;
        case 'ICE':
            onICE(signal);
            break;
    }

    // Store ICE strategy metadata
    if (signal._ice) {
        const call = getCallState(signal.call_id);
        if (call) {
            call.iceStrategy = signal._ice;
        }
    }
}

// 📨 Handle incoming INVITE
async function onINVITE(signal) {
    console.log("📞 Received INVITE from", signal.from, "signal:", signal);

    // Unlock audio for incoming call
    unlockAudio();

    callID = signal.call_id;
    currentPeer = signal.from;

    const existingCall = appState.calls[callID];
    if (existingCall && existingCall.state === CallState.ACTIVE && pc) {
        console.log("🔄 Received duplicate INVITE for active call!");
        return; // Skip UI ringing
    }

    // Store SDP offer for later use - SDP comes from backend in data field
    console.log("Processing INVITE signal:", signal);
    const call = createCallState(callID, signal.from, appState.localUserId);
    call.sdp = signal.sdp; // This should now be available after data merging
    appState.calls[callID] = call;

    console.log("Stored call state with SDP:", call.sdp ? "YES (" + (call.sdp ? call.sdp.substring(0, 50) + "..." : "null") + ")" : "NO", call);

    setCallState(callID, CallState.INVITE, signal.from, false); // incoming
    
    // Notify caller that we are ringing
    sendSignal({
        type: 'RINGING',
        call_id: callID,
        to: signal.from,
        from: appState.localUserId
    });
    
    showIncomingModal(signal.from, callID);
}

// ✅ Handle call acceptance (SDP answer)
async function onOK(signal) {
    console.log("✅ Call accepted, processing SDP answer, signal:", signal);

    try {
        if (signal.sdp) {
            console.log("📡 Setting remote description with answer SDP:", signal.sdp.substring(0, 100) + "...");
            await pc.setRemoteDescription({
                type: "answer",
                sdp: signal.sdp
            });
            console.log("✅ Call fully established, PC state:", pc.signalingState, "ICE state:", pc.iceConnectionState);
            
            // Transition the call state to ACTIVE for the caller
            setCallState(signal.call_id, CallState.ACTIVE);
            
            // Start QoS monitoring
            startQosMonitoring(pc);
            await processPendingIceCandidates();
        } else {
            console.error("❌ No SDP in OK signal!");
        }
    } catch(err) {
        console.error("❌ Failed to process OK signal:", err);
    }
}

function onREJECT(signal) {
    log('CALL', 'Call rejected:', signal.call_id);
    setCallState(signal.call_id, CallState.ENDED);
    cleanupCall(signal.call_id);
}

function onBYE(signal) {
    log('CALL', 'Call ended:', signal.call_id);
    setCallState(signal.call_id, CallState.ENDED);
    cleanupCall(signal.call_id);
}

// ❄️ Handle incoming ICE candidates
async function onICE(signal) {
    console.log("❄️ Received ICE signal:", signal);

    let iceData = null;

    // Check if ICE data is in signal.data
    if (signal.data) {
        try {
            iceData = typeof signal.data === 'string' ? JSON.parse(signal.data) : signal.data;
            console.log("❄️ Parsed ICE data:", iceData);
        } catch(e) {
            console.warn("❄️ Failed to parse ICE data:", e);
            return;
        }
    } else if (signal.candidate) {
        // Fallback for old format
        iceData = { candidate: signal.candidate };
    }

    if (!iceData || !iceData.candidate) {
        console.log("❄️ Skipping ICE - no candidate data found");
        return;
    }

    // If no PeerConnection yet or remote description not set, buffer the candidate data
    if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) {
        console.log("❄️ Buffering ICE candidate - PC or remote description not ready yet");
        pendingIceCandidates.push(iceData);
        return;
    }

    // Add the candidate to the PeerConnection
    try {
        const candidate = new RTCIceCandidate(iceData);
        await pc.addIceCandidate(candidate);
        console.log("❄️ Successfully added ICE candidate");
    } catch(err) {
        console.error("❄️ Failed to add ICE candidate:", err);
    }
}

// Process buffered ICE candidates once PC is ready
async function processPendingIceCandidates() {
    if (!pc || pendingIceCandidates.length === 0) return;

    console.log(`❄️ Processing ${pendingIceCandidates.length} buffered ICE candidates`);

    for (const iceData of pendingIceCandidates) {
        try {
            const candidate = new RTCIceCandidate(iceData);
            await pc.addIceCandidate(candidate);
            console.log("❄️ Added buffered ICE candidate");
        } catch(err) {
            console.error("❄️ Failed to add buffered ICE candidate:", err);
        }
    }

    pendingIceCandidates = [];
}

function cleanupCall(callId) {
    console.log("🧹 Cleaning up call", callId);

    // Close PeerConnection
    if (pc) {
        pc.close();
        pc = null;
    }

    // Stop local media tracks
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }

    // Stop remote audio
    const remoteAudio = document.getElementById("remoteAudio");
    if (remoteAudio && remoteAudio._stream) {
        remoteAudio._stream.getTracks().forEach(track => track.stop());
        remoteAudio.srcObject = null;
    }

    // Reset global state
    callID = null;
    currentPeer = null;

    // Remove call state after delay
    setTimeout(() => removeCall(callId), 5000);
}

/* =====================================================
   USER ACTIONS
   ===================================================== */
// 📞 Start call (INVITE)
async function sendINVITE() {
    const targetInput = document.getElementById('targetUser');
    if (!targetInput) return;

    const target = targetInput.value.trim();
    if (!target) return;

    // Unlock audio first
    unlockAudio();

    callID = crypto.randomUUID();
    currentPeer = target;
    appState.activeCallId = callID;

    setCallState(callID, CallState.INVITE, target, true); // outgoing

    // Create PeerConnection and get media
    createPeerConnection();
    const mediaSuccess = await initLocalMedia();

    if (!mediaSuccess) {
        log('CALL', 'Failed to get microphone - cannot make call');
        return;
    }

    // Create and send offer
    try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        sendSignal({
            type: 'INVITE',
            call_id: callID,
            from: appState.localUserId,
            to: target,
            sdp: offer.sdp
        });

        console.log("📞 INVITE sent with SDP offer");

        // Process any buffered ICE candidates now that local description is set
        setTimeout(() => processPendingIceCandidates(), 100);
    } catch(err) {
        console.error("Failed to create offer:", err);
    }
}

// ✅ Accept incoming call
async function acceptCall() {
    console.log("📞 Accepting call");

    const incomingCallId = document.getElementById('incomingCallId');
    if (!incomingCallId) {
        console.error("No incomingCallId element found!");
        return;
    }

    const callId = incomingCallId.value;
    console.log("Using callId from modal:", callId, "global callID:", callID);
    hideIncomingModal();

    setCallState(callId, CallState.ACTIVE);

    // Create PeerConnection and get media
    createPeerConnection();
    const mediaSuccess = await initLocalMedia();

    if (!mediaSuccess) {
        log('CALL', 'Failed to get microphone - rejecting call');
        rejectCall();
        return;
    }

    // Set remote description from INVITE SDP
    try {
        const call = getCallState(callId);
        console.log("AcceptCall - call:", call, "callId:", callId, "pc signaling state:", pc.signalingState);

        if (!call) {
            console.error("No call state found for callId:", callId);
            return;
        }

        if (!call.sdp) {
            console.error("No SDP found in call state! Call:", call);
            return;
        }

        console.log("Setting remote description with SDP:", call.sdp.substring(0, 100) + "...");

        await pc.setRemoteDescription({
            type: "offer",
            sdp: call.sdp
        });

        console.log("Remote description set successfully, PC state:", pc.signalingState);

        // Process any buffered ICE candidates now that remote description is set
        await processPendingIceCandidates();

        // Create and send answer
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        const targetPeer = (call && call.from) ? call.from : currentPeer;
        sendSignal({
            type: 'OK',
            call_id: callId,
            from: appState.localUserId,
            to: targetPeer,
            sdp: answer.sdp
        });

        console.log("📞 Call accepted, sent SDP answer");
        
        // Start QoS monitoring
        startQosMonitoring(pc);
    } catch(err) {
        console.error("Failed to accept call:", err);
    }
}

function rejectCall() {
    const incomingCallId = document.getElementById('incomingCallId');
    if (!incomingCallId) return;

    const callId = incomingCallId.value;
    hideIncomingModal();

    const call = getCallState(callId);
    if (call) {
        sendSignal({
            type: 'REJECT',
            call_id: callId,
            from: appState.localUserId,
            to: call.from
        });
    }

    setCallState(callId, CallState.ENDED);
    cleanupCall(callId);
}

function sendBYE() {
    endCall();
}

// 🔚 End call and cleanup
function endCall() {
    if (!callID) return;

    console.log("📴 Ending call", callID);

    sendSignal({
        type: 'BYE',
        call_id: callID,
        from: appState.localUserId,
        to: currentPeer
    });

    setCallState(callID, CallState.ENDED);
    cleanupCall(callID);
}

/* =====================================================
   DEBUG LOGGING
   ===================================================== */
function log(component, ...args) {
    const container = document.getElementById('signalLog');
    const entry = document.createElement('div');
    entry.className = 'debug-entry';
    
    const ts = new Date().toLocaleTimeString();
    let html = `<span class="ts">[${ts}]</span> `;
    html += `<span class="type">${component}</span> `;
    
    args.forEach(arg => {
        if (typeof arg === 'string') {
            html += `<span class="from">${arg}</span> `;
        } else if (typeof arg === 'object') {
            html += `<span class="meta">${JSON.stringify(arg)}</span> `;
        } else {
            html += `${arg} `;
        }
    });
    
    entry.innerHTML = html;
    container.insertBefore(entry, container.firstChild);
    
    // Keep only last 50
    while (container.children.length > 50) {
        container.removeChild(container.lastChild);
    }
    
    console.log(`[${component}]`, ...args);
}

// QoS Monitoring Telemetry
let qosInterval = null;
function startQosMonitoring(peerConnection) {
    if (qosInterval) clearInterval(qosInterval);
    if (!peerConnection) return;
    
    console.log("📊 Starting QoS Telemetry monitoring...");
    let lastBytesReceived = 0;
    let lastTimestamp = 0;
    
    // Add UI container for stats if it doesn't exist
    let statsContainer = document.getElementById('qos-stats');
    if (!statsContainer) {
        const controls = document.querySelector('.controls');
        statsContainer = document.createElement('div');
        statsContainer.id = 'qos-stats';
        statsContainer.style = 'margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 8px; font-size: 0.9em; font-family: monospace; display: none;';
        if (controls) controls.appendChild(statsContainer);
    }
    
    statsContainer.style.display = 'block';

    qosInterval = setInterval(async () => {
        if (peerConnection.signalingState === 'closed') {
            clearInterval(qosInterval);
            statsContainer.style.display = 'none';
            return;
        }

        try {
            const stats = await peerConnection.getStats(null);
            let packetLoss = 0;
            let jitter = 0;
            let rtt = 0;
            let bitrate = 0;

            stats.forEach(report => {
                if (report.type === 'inbound-rtp' && report.kind === 'audio') {
                    const packetsLost = report.packetsLost || 0;
                    const packetsReceived = report.packetsReceived || 0;
                    if (packetsReceived + packetsLost > 0) {
                        packetLoss = ((packetsLost / (packetsReceived + packetsLost)) * 100).toFixed(1);
                    }
                    jitter = (report.jitter * 1000).toFixed(1); // convert to ms
                    
                    // Calculate bitrate
                    if (lastTimestamp > 0) {
                        const bytesReceived = report.bytesReceived;
                        const timeDiff = report.timestamp - lastTimestamp;
                        const bitDiff = (bytesReceived - lastBytesReceived) * 8;
                        bitrate = Math.round(bitDiff / timeDiff); // kbps
                    }
                    lastBytesReceived = report.bytesReceived;
                    lastTimestamp = report.timestamp;
                }
                
                if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                    rtt = (report.currentRoundTripTime * 1000).toFixed(1); // ms
                }
            });

            // Update UI
            let quality = '🟢 Excellent';
            if (packetLoss > 2 || jitter > 30 || rtt > 150) quality = '🟡 Fair';
            if (packetLoss > 5 || jitter > 50 || rtt > 300) quality = '🔴 Poor';

            statsContainer.innerHTML = `
                <div><strong>Signal Quality:</strong> ${quality}</div>
                <div style="color: #aaa; margin-top: 4px;">
                    Loss: ${packetLoss}% | Jitter: ${jitter}ms<br>
                    RTT: ${rtt}ms | Bitrate: ${bitrate} kbps
                </div>
            `;
        } catch (e) {
            console.warn("📊 QoS monitoring error:", e);
        }
    }, 2000);
}

// Audio energy monitoring
function startAudioEnergyMonitoring(stream) {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);

        analyser.fftSize = 256;
        microphone.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        console.log("🎵 Started audio energy monitoring");

        const monitor = () => {
            analyser.getByteFrequencyData(dataArray);
            const sum = dataArray.reduce((a, b) => a + b, 0);
            const average = sum / dataArray.length;

            // Log energy levels periodically
            if (Math.random() < 0.1) { // Log ~10% of the time to avoid spam
                console.log("🎵 Audio energy:", average.toFixed(2), "max:", Math.max(...dataArray));
            }

            if (average > 0) {
                console.log("🎵 AUDIO DETECTED! Energy level:", average.toFixed(2));
            }

            requestAnimationFrame(monitor);
        };

        monitor();
    } catch(e) {
        console.error("🎵 Audio monitoring failed:", e);
    }
}

/* =====================================================
   AUDIO FEEDBACK
   ===================================================== */
function playRingingSound() {
    try {
        // Simple beep using oscillator - only works after user gesture
        if (window.AudioContext || window.webkitAudioContext) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Check if audio context needs to be resumed (required by browsers)
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    createRingingTone(audioContext);
                }).catch(e => {
                    log('AUDIO', 'Could not resume audio context:', e.message);
                    // Fallback: no audio, just visual indicator
                    showVisualRing();
                });
            } else {
                createRingingTone(audioContext);
            }
        } else {
            // Fallback for browsers without Web Audio
            showVisualRing();
        }
    } catch(e) {
        log('AUDIO', 'Could not play ringing sound:', e.message);
        showVisualRing();
    }
}

function createRingingTone(audioContext) {
    try {
        if (ringingAudio) {
            ringingAudio.pause();
        }

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
        oscillator.type = 'sine';

        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 1); // Play for 1 second

        // Store for cleanup
        ringingAudio = { _oscillator: oscillator, _audioContext: audioContext };

        // Schedule next ring after 3 seconds of silence (only if audio still unlocked)
        setTimeout(() => {
            if (ringingAudio && audioUnlocked) {
                createRingingTone(audioContext);
            }
        }, 3000);

    } catch(e) {
        log('AUDIO', 'Error creating ringing tone:', e.message);
        showVisualRing();
    }
}

function showVisualRing() {
    // Visual indicator when audio is not available
    const modal = document.getElementById('incomingModal');
    if (modal) {
        modal.style.animation = 'pulse 1s infinite';
    }
}

function stopRingingSound() {
    try {
        if (ringingAudio) {
            if (ringingAudio._oscillator) {
                ringingAudio._oscillator.stop();
            }
            ringingAudio.pause();
            ringingAudio = null;
        }
    } catch(e) {
        log('AUDIO', 'Error stopping ringing sound:', e.message);
    }
}
