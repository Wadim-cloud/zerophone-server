<!DOCTYPE html>
<html>
<head>
    <title>ZeroPhone</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e14;
            color: #79c0ff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 8px 0;
        }

        .subtitle {
            color: #8b949e;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
            text-align: left;
        }

        .feature {
            background: #161b22;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #21262d;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-title {
            color: #c9d1d9;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-desc {
            color: #8b949e;
            font-size: 12px;
        }

        .nav-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 32px;
        }

        .nav-link {
            padding: 12px 24px;
            background: #238636;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: #2ea043;
        }

        .nav-link.debug {
            background: #1f3a5f;
        }

        .nav-link.debug:hover {
            background: #264d73;
        }

        .version {
            color: #6e7681;
            font-size: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📡 ZeroPhone</h1>
    <p class="subtitle">Distributed Telecom Control Terminal</p>

    <div class="features">
        <div class="feature">
            <div class="feature-icon">🧠</div>
            <div class="feature-title">SIP FSM</div>
            <div class="feature-desc">State machine mirrors backend</div>
        </div>
        
        <div class="feature">
            <div class="feature-icon">🌐</div>
            <div class="feature-title">Cluster Aware</div>
            <div class="feature-desc">Route gossip + ICE strategy</div>
        </div>
        
        <div class="feature">
            <div class="feature-icon">🔗</div>
            <div class="feature-title">WebRTC</div>
            <div class="feature-desc">Native SDP/ICE exchange</div>
        </div>
        
        <div class="feature">
            <div class="feature-icon">📊</div>
            <div class="feature-title">Real-time</div>
            <div class="feature-desc">Signal logging + FSM visual</div>
        </div>
    </div>

    <div class="nav-links">
        <a href="/call.html" class="nav-link">📞 Control Terminal</a>
        <a href="/debug.html" class="nav-link debug">🔍 Debug</a>
    </div>

    <p class="version">ZeroPhone v2.0 • core/signal_router + cluster</p>
</div>

</body>
</html>
