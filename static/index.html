<!DOCTYPE html>
<html>
<head>
    <title>ZeroPhone — Voice Call</title>
    <meta charset="UTF-8">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --success: #3fb950; --danger: #f85149; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 400px; margin: 0 auto; text-align: center; }
        h1 { color: var(--accent); margin-bottom: 20px; }
        .btn { background: var(--accent); color: white; border: none; padding: 16px 32px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; width: 100%; margin: 8px 0; }
        .btn.call { background: var(--success); }
        .btn.end { background: var(--danger); }
        .status { padding: 12px; margin: 12px 0; border-radius: 8px; background: var(--card); }
        .status.idle { border: 1px solid var(--border); }
        .status.connecting { border: 1px solid var(--warning); color: #f0883e; }
        .status.active { border: 1px solid var(--success); color: var(--success); }
        #peers { margin: 20px 0; }
        .peer { padding: 12px; margin: 8px 0; border-radius: 8px; background: var(--card); display: flex; justify-content: space-between; align-items: center; }
        .peer-name { font-weight: 600; }
        .log { font-size: 0.75rem; color: #8b949e; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📞 ZeroPhone</h1>
        <div id="my-name" style="color: var(--accent); margin-bottom: 20px;">Loading...</div>

        <div id="status" class="status idle">Not connected</div>

        <div id="peers"></div>

        <div class="log" id="log"></div>
    </div>

    <script>
        const SERVER = location.origin;
        const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/';
        
        // State
        let ws = null;
        let myId = localStorage.getItem('zerophone_id') || 'user-' + Math.random().toString(36).substr(2,8);
        let myName = localStorage.getItem('zerophone_name') || prompt('Enter your name:', 'User-' + Math.random().toString(36).substr(2,6).toUpperCase());
        if (myName) localStorage.setItem('zerophone_name', myName);
        let peers = [];
        let callState = 'idle';
        let callId = '';
        let callPeerId = '';
        let pc = null;
        let localStream = null;
        let incomingOffer = null;
        let pendingCandidates = [];
        
        // Call states
        const CallState = { IDLE: 'idle', INVITING: 'inviting', RINGING: 'ringing', CONNECTING: 'connecting', ACTIVE: 'active' };
        
        // WebRTC config with STUN/TURN
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'turn:turn.wadiem.cloudns.be:3478', username: 'zerophone', credential: 'zerophone123' }
            ]
        };
        
        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = new Date().toLocaleTimeString() + ' ' + msg;
            el.insertBefore(entry, el.firstChild);
        }
        
        function updateStatus(s) {
            callState = s;
            const el = document.getElementById('status');
            el.className = 'status ' + s;
            const texts = { idle: 'Ready', inviting: 'Calling...', ringing: 'Incoming...', connecting: 'Connecting...', active: 'In Call' };
            el.textContent = texts[s] || s;
        }
        
        function connect() {
            ws = new WebSocket(WS_URL + myId);
            
            ws.onopen = () => {
                log('Connected as ' + myName, 'success');
                document.getElementById('my-name').textContent = myName;
                updateStatus(CallState.IDLE);
                getUserMedia();
                refreshPeers();
            };
            
            ws.onmessage = async (e) => {
                const msg = JSON.parse(e.data);
                log('[WS] ' + msg.type, 'info');
                await handleMessage(msg);
            };
            
            ws.onclose = () => {
                log('Disconnected, reconnecting...', 'error');
                updateStatus(CallState.IDLE);
                setTimeout(connect, 3000);
            };
            
            ws.onerror = (e) => log('Error: ' + e, 'error');
        }
        
        async function handleMessage(msg) {
            switch(msg.type) {
                case 'USERS':
                    if (Array.isArray(msg.users)) {
                        peers = msg.users.map(u => typeof u === 'string' ? { id: u, name: u } : u).filter(p => p.id !== myId);
                    }
                    renderPeers();
                    break;
                    
                case 'CALL_INVITE':
                    if (callState === CallState.IDLE) {
                        callId = msg.call_id;
                        callPeerId = msg.from;
                        incomingOffer = msg.payload?.sdp || msg.sdp;
                        updateStatus(CallState.RINGING);
                        document.getElementById('status').textContent = 'Incoming from ' + (msg.from_name || msg.from);
                        log('Incoming call from ' + (msg.from_name || msg.from), 'warn');
                        renderPeers();
                    }
                    break;
                    
                case 'CALL_ACCEPT':
                    if (callState === CallState.INVITING) {
                        updateStatus(CallState.CONNECTING);
                        if (pc && msg.payload?.sdp) {
                            await pc.setRemoteDescription(new RTCSessionDescription(msg.payload.sdp));
                        }
                        updateStatus(CallState.ACTIVE);
                        log('Call connected!', 'success');
                    }
                    break;
                    
                case 'CALL_REJECT':
                    log('Call rejected', 'error');
                    endCall();
                    break;
                    
                case 'ICE_CANDIDATE':
                case 'ICE':
                    if (pc && pc.remoteDescription) {
                        const candidate = msg.candidate || msg.payload;
                        if (candidate) {
                            await pc.addIceCandidate(new RTCIceCandidate(candidate));
                        }
                    } else {
                        pendingCandidates.push(msg.candidate || msg.payload);
                    }
                    break;
                    
                case 'CALL_END':
                    log('Call ended by remote', 'warn');
                    endCall();
                    break;
            }
        }
        
        async function getUserMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                log('Microphone ready', 'success');
            } catch(e) {
                log('Mic error: ' + e.message, 'error');
            }
        }
        
        function renderPeers() {
            const el = document.getElementById('peers');
            if (peers.length === 0) {
                el.innerHTML = '<div style="color: var(--muted); padding: 20px;">No contacts online</div>';
                return;
            }
            el.innerHTML = peers.map(p => 
                '<div class="peer">' +
                    '<div><div class="peer-name">' + (p.name || p.id) + '</div></div>' +
                    '<button class="btn btn-call" style="width: auto; padding: 8px 16px;" onclick="makeCall(\'' + p.id + '\')">Call</button>' +
                '</div>'
            ).join('');
        }
        
        async function refreshPeers() {
            ws.send(JSON.stringify({ type: 'GET_USERS' }));
        }
        
        async function makeCall(peerId) {
            if (callState !== CallState.IDLE) return;
            
            callId = 'call-' + Date.now();
            callPeerId = peerId;
            const peer = peers.find(p => p.id === peerId);
            
            updateStatus(CallState.INVITING);
            log('Calling ' + (peer?.name || peerId));
            
            pc = new RTCPeerConnection(rtcConfig);
            
            pc.oniceconnectionstatechange = () => log('[ICE] ' + pc.iceConnectionState);
            pc.onconnectionstatechange = () => log('[WebRTC] ' + pc.connectionState);
            
            pc.onicecandidate = (e) => {
                if (e.candidate && ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'ICE', to: peerId, call_id: callId, candidate: e.candidate }));
                }
            };
            
            pc.ontrack = (e) => {
                const audio = document.createElement('audio');
                audio.srcObject = e.streams[0];
                audio.autoplay = true;
                audio.controls = true;
                document.body.appendChild(audio);
            };
            
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            ws.send(JSON.stringify({
                type: 'CALL_INVITE',
                to: peerId,
                call_id: callId,
                payload: { sdp: pc.localDescription }
            }));
        }
        
        async function acceptCall() {
            if (!callPeerId || !incomingOffer) return;
            
            pc = new RTCPeerConnection(rtcConfig);
            
            pc.oniceconnectionstatechange = () => log('[ICE] ' + pc.iceConnectionState);
            pc.onconnectionstatechange = () => log('[WebRTC] ' + pc.connectionState);
            
            pc.onicecandidate = (e) => {
                if (e.candidate && ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'ICE', to: callPeerId, call_id: callId, candidate: e.candidate }));
                }
            };
            
            pc.ontrack = (e) => {
                const audio = document.createElement('audio');
                audio.srcObject = e.streams[0];
                audio.autoplay = true;
                audio.controls = true;
                document.body.appendChild(audio);
            };
            
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }
            
            updateStatus(CallState.CONNECTING);
            
            await pc.setRemoteDescription(new RTCSessionDescription(incomingOffer));
            
            // Add buffered candidates
            for (const c of pendingCandidates) {
                await pc.addIceCandidate(new RTCIceCandidate(c));
            }
            pendingCandidates = [];
            
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            ws.send(JSON.stringify({
                type: 'CALL_ACCEPT',
                to: callPeerId,
                call_id: callId,
                payload: { sdp: pc.localDescription }
            }));
            
            updateStatus(CallState.ACTIVE);
            log('Call answered', 'success');
        }
        
        function rejectCall() {
            if (!callPeerId) return;
            ws.send(JSON.stringify({ type: 'CALL_REJECT', to: callPeerId, call_id: callId }));
            endCall();
        }
        
        function endCall() {
            if (pc) { pc.close(); pc = null; }
            if (ws && ws.readyState === 1 && callPeerId) {
                ws.send(JSON.stringify({ type: 'CALL_END', to: callPeerId, call_id: callId }));
            }
            callState = CallState.IDLE;
            callId = '';
            callPeerId = '';
            incomingOffer = null;
            pendingCandidates = [];
            updateStatus(CallState.IDLE);
            renderPeers();
            log('Call ended');
        }
        
        connect();
    </script>
</body>
</html>
