<!DOCTYPE html>
<html>
<head>
    <title>ZeroPhone — Voice Call</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
            --success: #3fb950; --danger: #f85149; --warning: #f0883e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg); color: var(--text); padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        h1 { color: var(--accent); font-size: 1.5rem; }
        .btn {
            background: var(--accent); color: white; border: none;
            padding: 12px 24px; border-radius: 8px; cursor: pointer;
            font-size: 1rem; width: 100%; margin: 8px 0;
        }
        .btn:hover { opacity: 0.9; }
        .btn-call { background: var(--success); }
        .btn-end { background: var(--danger); }
        
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; padding: 20px; margin-bottom: 16px;
        }
        .peer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid var(--border);
        }
        .peer:last-child { border-bottom: none; }
        .peer-name { font-weight: 600; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }
        .online { background: rgba(63,185,80,0.2); color: var(--success); }
        .offline { background: rgba(248,81,73,0.2); color: var(--danger); }
        
        .log {
            background: var(--card); border-radius: 8px; padding: 12px;
            font-family: monospace; font-size: 0.75rem; max-height: 200px; overflow-y: auto;
        }
        .log-entry { color: var(--muted); margin: 4px 0; }
        
        /* Call screens */
        .call-screen { display: none; text-align: center; padding: 40px; }
        .call-screen.active { display: block; }
        .call-timer { font-size: 2rem; font-weight: 600; margin: 20px 0; }
        
        /* Debug panel */
        .debug {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; margin-top: 16px;
            font-size: 0.75rem;
        }
        .debug-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📞 ZeroPhone</h1>
            <span id="my-name" style="color: var(--muted)">-</span>
        </header>
        
        <!-- Main screen -->
        <div id="main-screen">
            <div class="card">
                <h3>Contacts</h3>
                <div id="peers">
                    <div style="color: var(--muted); padding: 20px; text-align: center;">
                        Connecting to network...
                    </div>
                </div>
                <button class="btn" onclick="refreshPeers()">↻ Refresh</button>
            </div>
            
            <div class="card">
                <h3>Activity</h3>
                <div class="log" id="log"></div>
            </div>
            
            <div class="debug">
                <h3>🔧 Debug</h3>
                <div class="debug-grid">
                    <div>State: <span id="debug-state">idle</span></div>
                    <div>WS: <span id="debug-ws">disconnected</span></div>
                    <div>Peers: <span id="debug-peers">0</span></div>
                    <div>Calls: <span id="debug-calls">0</span></div>
                </div>
            </div>
        </div>
        
        <!-- Incoming call -->
        <div id="incoming-screen" class="call-screen">
            <h2>Incoming Call</h2>
            <div class="call-timer" id="incoming-caller">-</div>
            <p>is calling you...</p>
            <button class="btn btn-call" onclick="acceptCall()">Answer</button>
            <button class="btn btn-end" onclick="rejectCall()">Reject</button>
        </div>
        
        <!-- Outgoing call -->
        <div id="outgoing-screen" class="call-screen">
            <h2>Calling...</h2>
            <div class="call-timer" id="outgoing-callee">-</div>
            <button class="btn btn-end" onclick="endCall()">End Call</button>
        </div>
        
        <!-- Active call -->
        <div id="active-screen" class="call-screen">
            <h2>In Call</h2>
            <div class="call-timer" id="call-peer">-</div>
            <button class="btn btn-end" onclick="endCall()">End Call</button>
        </div>
    </div>
    
    <script>
        // Config
        const SERVER = location.origin;
        const WS_URL = SERVER.replace(/^http/, 'ws') + '/ws/';
        
        // State
        let ws = null;
        let myId = localStorage.getItem('zerophone_id');
        let myName = localStorage.getItem('zerophone_name') || 'user-' + Math.random().toString(36).substr(2,6);
        let peers = [];
        let callState = 'idle';
        let callId = '';
        let callPeerId = '';
        let pc = null;
        let localStream = null;
        
        // Call states
        const CallState = {
            IDLE: 'idle',
            INVITING: 'inviting',
            RINGING: 'ringing', 
            CONNECTING: 'connecting',
            ACTIVE: 'active'
        };
        
        // WebRTC config
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        // Logging
        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = new Date().toLocaleTimeString() + ' ' + msg;
            el.insertBefore(entry, el.firstChild);
            if (el.children.length > 50) el.lastChild.remove();
        }
        
        // Debug display
        function updateDebug() {
            document.getElementById('debug-state').textContent = callState;
            document.getElementById('debug-ws').textContent = ws ? (ws.readyState === 1 ? 'connected' : 'connecting') : 'disconnected';
            document.getElementById('debug-peers').textContent = peers.length;
            document.getElementById('debug-calls').textContent = callState !== 'idle' ? '1' : '0';
        }
        
        // WebSocket connection
        function connectWS() {
            if (!myId) {
                // Register first
                fetch(SERVER + '/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: myName})
                }).then(r => {
                    const contentType = r.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        throw new Error('Server returned error: ' + r.status);
                    }
                    return r.json();
                }).then(d => {
                    myId = d.id;
                    localStorage.setItem('zerophone_id', myId);
                    localStorage.setItem('zerophone_name', myName);
                    document.getElementById('my-name').textContent = myName;
                    connectWS();
                }).catch(e => {
                    log('Register failed: ' + e.message, 'error');
                    setTimeout(connectWS, 5000);
                });
                return;
            }
            
            ws = new WebSocket(WS_URL + myId);
            
            ws.onopen = () => {
                log('Connected to network', 'success');
                updateDebug();
                getUserMedia();
                refreshPeers();
            };
            
            ws.onmessage = async (e) => {
                const msg = JSON.parse(e.data);
                handleMessage(msg);
            };
            
            ws.onclose = () => {
                log('Disconnected, reconnecting...');
                updateDebug();
                setTimeout(connectWS, 3000);
            };
            
            ws.onerror = (e) => log('WS Error: ' + e, 'error');
        }
        
        // Handle incoming WebSocket messages
        async function handleMessage(msg) {
            switch(msg.type) {
                case 'USERS':
                    peers = msg.users || [];
                    renderPeers();
                    break;
                    
                case 'CALL_INVITE':
                    if (callState === CallState.IDLE) {
                        callId = msg.call_id;
                        callPeerId = msg.from;
                        callState = CallState.RINGING;
                        document.getElementById('incoming-caller').textContent = msg.from_name || msg.from;
                        showScreen('incoming-screen');
                        log('Incoming call from ' + (msg.from_name || msg.from), 'warn');
                        // Auto-answer for demo
                        setTimeout(() => acceptCall(), 2000);
                    }
                    break;
                    
                case 'CALL_ACCEPT':
                    if (callState === CallState.INVITING) {
                        pc.setRemoteDescription(new RTCSessionDescription(msg.payload.sdp));
                        callState = CallState.ACTIVE;
                        showScreen('active-screen');
                        log('Call connected!', 'success');
                    }
                    break;
                    
                case 'CALL_RINGING':
                    log('Ringing...');
                    break;
                    
                case 'ICE_CANDIDATE':
                    if (pc && msg.payload) {
                        await pc.addIceCandidate(new RTCIceCandidate(msg.payload));
                    }
                    break;
                    
                case 'CALL_END':
                    endCall();
                    break;
                    
                case 'CALL_REJECT':
                    log('Call rejected', 'error');
                    endCall();
                    break;
            }
            updateDebug();
        }
        
        // Get user media
        async function getUserMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                log('Microphone ready', 'success');
            } catch(e) {
                log('Mic error: ' + e.message, 'error');
            }
        }
        
        // Refresh peer list via HTTP (fallback)
        async function refreshPeers() {
            try {
                const r = await fetch(SERVER + '/nodes');
                const contentType = r.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    log('Server error: ' + r.status, 'error');
                    return;
                }
                const data = await r.json();
                peers = data.filter(p => p.id !== myId);
                renderPeers();
            } catch(e) {
                log('Refresh failed: ' + e.message, 'error');
            }
        }
        
        // Render peers
        function renderPeers() {
            const el = document.getElementById('peers');
            if (peers.length === 0) {
                el.innerHTML = '<div style="color: var(--muted); padding: 20px; text-align: center;">No contacts online</div>';
                return;
            }
            el.innerHTML = peers.map(p => 
                '<div class="peer">' +
                    '<div><div class="peer-name">' + (p.name || p.id) + '</div>' +
                    '<div style="color: var(--muted); font-size: 0.75rem;">' + (p.ip || 'N/A') + '</div></div>' +
                    '<button class="btn btn-call" style="width: auto; padding: 8px 16px;" onclick="makeCall(\'' + p.id + '\')">Call</button>' +
                '</div>'
            ).join('');
        }
        
        // Make a call
        async function makeCall(peerId) {
            if (callState !== CallState.IDLE) return;
            
            callId = 'call-' + Date.now();
            callPeerId = peerId;
            callState = CallState.INVITING;
            
            const peer = peers.find(p => p.id === peerId);
            document.getElementById('outgoing-callee').textContent = peer?.name || peerId;
            showScreen('outgoing-screen');
            log('Calling ' + (peer?.name || peerId));
            
            // Create WebRTC connection
            pc = new RTCPeerConnection(rtcConfig);
            pc.onicecandidate = (e) => {
                if (e.candidate && ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'ICE_CANDIDATE', to: peerId, call_id: callId, payload: e.candidate }));
                }
            };
            pc.ontrack = (e) => {
                const audio = document.createElement('audio');
                audio.srcObject = e.streams[0];
                audio.autoplay = true;
                audio.controls = true;
                document.body.appendChild(audio);
            };
            
            // Add local tracks
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }
            
            // Create offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            // Send via WebSocket
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({
                    type: 'CALL_INVITE',
                    to: peerId,
                    call_id: callId,
                    payload: { sdp: pc.localDescription }
                }));
            }
            
            updateDebug();
        }
        
        // Accept call
        async function acceptCall() {
            if (!callPeerId) return;
            
            pc = new RTCPeerConnection(rtcConfig);
            pc.onicecandidate = (e) => {
                if (e.candidate && ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'ICE_CANDIDATE', to: callPeerId, call_id: callId, payload: e.candidate }));
                }
            };
            pc.ontrack = (e) => {
                const audio = document.createElement('audio');
                audio.srcObject = e.streams[0];
                audio.autoplay = true;
                document.body.appendChild(audio);
            };
            
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }
            
            // For simplicity, auto-accept the call
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            ws.send(JSON.stringify({
                type: 'CALL_ACCEPT',
                to: callPeerId,
                call_id: callId,
                payload: { sdp: pc.localDescription }
            }));
            
            callState = CallState.ACTIVE;
            document.getElementById('call-peer').textContent = callPeerId;
            showScreen('active-screen');
            log('Call answered', 'success');
            updateDebug();
        }
        
        // Reject call
        function rejectCall() {
            ws.send(JSON.stringify({ type: 'CALL_REJECT', to: callPeerId, call_id: callId }));
            endCall();
        }
        
        // End call
        function endCall() {
            if (pc) { pc.close(); pc = null; }
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'CALL_END', to: callPeerId, call_id: callId }));
            }
            callState = CallState.IDLE;
            callId = '';
            callPeerId = '';
            showScreen('main-screen');
            log('Call ended');
            updateDebug();
        }
        
        // Screen navigation
        function showScreen(id) {
            document.querySelectorAll('.call-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id + '-screen')?.classList.add('active');
        }
        
        // Init
        connectWS();
        setInterval(updateDebug, 1000);
        document.getElementById('my-name').textContent = myName;
    </script>
</body>
</html>
